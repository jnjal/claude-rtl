<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            width: 220px;
            padding: 16px;
            background: #141413;
            color: #e8e8e8;
            font-family: Tahoma, Arial, sans-serif;
            font-size: 13px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
            padding-bottom: 12px;
            border-bottom: 1px solid #333332;
        }

        .logo {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, #FF6F61, #FF8A75);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .title {
            font-size: 13px;
            font-weight: bold;
            color: #FF8A75;
        }

        .subtitle {
            font-size: 10px;
            color: #a0a09a;
            margin-top: 1px;
        }

        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
        }

        .label {
            font-size: 12px;
            color: #e8e8e8;
        }

        .status-text {
            font-size: 10px;
            color: #a0a09a;
            margin-top: 1px;
        }

        /* Toggle Switch */
        .toggle {
            position: relative;
            width: 42px;
            height: 24px;
            flex-shrink: 0;
        }

        .toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background: #333332;
            border-radius: 24px;
            transition: 0.2s;
        }

        .slider:before {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            right: 3px;
            top: 3px;
            background: #e8e8e8;
            border-radius: 50%;
            transition: 0.2s;
        }

        input:checked + .slider {
            background: #FF8A75;
        }

        input:checked + .slider:before {
            transform: translateX(-18px);
            background: #fff;
        }

        .footer {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid #333332;
            text-align: center;
            font-size: 10px;
            color: #a0a09a;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">ف</div>
        <div>
            <div class="title">Claude RTL Fixer</div>
            <div class="subtitle">v2.0</div>
        </div>
    </div>

    <div class="row">
        <div>
            <div class="label">راست‌چین + وزیرمتن</div>
            <div class="status-text" id="statusText">در حال بارگذاری...</div>
        </div>
        <label class="toggle">
            <input type="checkbox" id="toggleSwitch">
            <span class="slider"></span>
        </label>
    </div>

    <div class="footer">فقط روی claude.ai فعاله</div>

    <script src="popup.js"></script>
</body>
</html>
